<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios · api-rest</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>👥 Gestión de usuarios</h1>
      <span id="health" class="badge badge--unknown">comprobando…</span>
    </header>

    <main class="container">
      <!-- Configuración del endpoint de la API -->
      <section class="card">
        <label for="apiBase">URL de la API</label>
        <div class="row">
          <input
            id="apiBase"
            type="text"
            placeholder="http://localhost:3000"
            autocomplete="off"
          />
          <button id="saveApiBase" class="btn btn--ghost">Guardar</button>
        </div>
        <p class="hint">
          En local usa <code>http://localhost:3000</code>. En producción, la URL
          pública de Railway.
        </p>
      </section>

      <!-- Formulario crear / editar -->
      <section class="card">
        <h2 id="formTitle">Nuevo usuario</h2>
        <form id="userForm" class="form">
          <input type="hidden" id="userId" />
          <div class="field">
            <label for="name">Nombre</label>
            <input id="name" type="text" required placeholder="Ada Lovelace" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" required placeholder="ada@example.com" />
          </div>
          <div class="row">
            <button type="submit" class="btn btn--primary" id="submitBtn">Crear</button>
            <button type="button" class="btn btn--ghost" id="cancelBtn" hidden>Cancelar</button>
          </div>
        </form>
        <p id="formMsg" class="msg" role="alert"></p>
      </section>

      <!-- Listado -->
      <section class="card">
        <div class="row row--between">
          <h2>Usuarios</h2>
          <button id="reloadBtn" class="btn btn--ghost">↻ Recargar</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Creado</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="usersBody">
              <tr>
                <td colspan="5" class="empty">Cargando…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
